services:
  web:
    build: .
    ports: ["${PORT:-3000}:3000"]
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?copy .env.example to .env and set ADMIN_TOKEN}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    volumes: ["dbdata:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
volumes:
  dbdata: {}
